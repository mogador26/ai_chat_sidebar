# Équivalent GitLab CI : tests + lint -> paquets .zip et .xpi -> (sur tag vX.Y.Z) signature facultative + Release.
# Variables CI/CD facultatives pour signer : AMO_API_KEY, AMO_API_SECRET (masquées, protégées).
image: node:22-bookworm-slim

stages: [check, package, release]

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d/

check:
  stage: check
  script:
    - npm test
    - npm run lint

package:
  stage: package
  needs: [check]
  script:
    - npm run build
    - for f in dist/*.zip; do cp "$f" "${f%.zip}.xpi"; done
    - ls -l dist
  artifacts:
    name: ai-chat-sidebar-$CI_COMMIT_SHORT_SHA
    paths: [dist/*.zip, dist/*.xpi]
    expire_in: 30 days

release:
  stage: release
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq ca-certificates > /dev/null
    - v="$(jq -r .version manifest.json)"
    - '[ "$CI_COMMIT_TAG" = "v$v" ] || { echo "Tag $CI_COMMIT_TAG différent de manifest.json ($v)"; exit 1; }'
    - |
      if [ -n "$AMO_API_KEY" ]; then
        WEB_EXT_API_KEY="$AMO_API_KEY" WEB_EXT_API_SECRET="$AMO_API_SECRET" npm run sign
        cp web-ext-artifacts/*.xpi "dist/ai_chat_sidebar-$v-signed.xpi"
      else
        echo "Pas de clés AMO : paquets non signés uniquement."
      fi
  artifacts:
    paths: [dist/*.zip, dist/*.xpi]
    expire_in: never
