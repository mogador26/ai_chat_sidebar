# Chaîne CI/CD : tests + lint -> paquets .zip et .xpi -> (sur tag vX.Y.Z) signature Mozilla facultative + Release GitHub.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Tests et lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint

  package:
    name: Paquets zip et xpi
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Construire le zip et en dériver le xpi
        run: |
          npm run build
          for f in dist/*.zip; do cp "$f" "${f%.zip}.xpi"; done
          ls -l dist
      - name: Version du manifeste
        id: meta
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Contrôler le contenu du paquet (ni tests, ni specs, ni dépendances)
        run: |
          if unzip -Z1 dist/*.zip | grep -E '^(tests|specs|\.specify|node_modules|\.github)/.+|^(package(-lock)?\.json|Dockerfile)$'; then
            echo "::error::Fichiers de développement présents dans le paquet"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ai-chat-sidebar-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release (tag vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # création de la Release
    env:
      # Secrets facultatifs (addons.mozilla.org -> Outils pour développeurs -> Clés API). Sans eux : pas de signature.
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Le tag doit correspondre à la version du manifeste
        run: |
          v="$(jq -r .version manifest.json)"
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} différent de manifest.json (version ${v})"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-chat-sidebar-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        if: env.WEB_EXT_API_KEY != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Signer avec Mozilla (canal non répertorié)
        if: env.WEB_EXT_API_KEY != ''
        run: |
          npm ci --no-audit --no-fund
          npm run sign
          v="$(jq -r .version manifest.json)"
          cp web-ext-artifacts/*.xpi "dist/ai_chat_sidebar-${v}-signed.xpi"
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.xpi \
            --title "AI Chat Sidebar ${GITHUB_REF_NAME}" --generate-notes --verify-tag
